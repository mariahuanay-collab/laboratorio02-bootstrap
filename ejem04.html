<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio 01 - Listas</title>
  <!-- Bootstrap 5.3.3 CSS vía Plantilla -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>
<body>
  <div class="container my-4">
    <span class="badge bg-secondary mb-2 text-uppercase">Tema: Listas</span>
    <!--li{Elemento $}*5-->
    <ul class="list-unstyled">
      <li>Elemento 1</li>
      <li>Elemento 2</li>
      <li>Elemento 3</li>
      <li>Elemento 4</li>
      <li>Elemento 5</li>
        <ul>
          <!--ul>li{Subelemento $}*5-->
          <li>Subelemento 1</li>
          <li>Subelemento 2</li>
          <li>Subelemento 3</li>
          <li>Subelemento 4</li>
          <li>Subelemento 5</li>
        </ul>
    </ul>

    <hr class="my-4">

    <!-- Lista en línea para menús (list-inline) -->
    <ol class="list-inline">
      <li class="list-inline-item">Elemento 1</li>
      <li class="list-inline-item">Elemento 2</li>
      <li class="list-inline-item">Elemento 3</li>
      <li class="list-inline-item">Elemento 4</li>
      <li class="list-inline-item">Elemento 5</li>
    </ol>
  </div>

  <!-- Bootstrap 5.3.3 JS Bundle (Incluye Popper.js) -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
