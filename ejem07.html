<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio 01 - Formulario</title>
  <!-- Bootstrap 5.3.3 CSS vía Plantilla -->
  <link rel="stylesheet" href="Plantilla/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-4">
    <span class="badge bg-secondary mb-2 text-uppercase">Tema: Formulario</span>
    <form action="">
      <div class="mb-3">
        <label class="form-label" for="name">Nombre</label>
        <input class="form-control" type="text" id="name" placeholder="Por favor ingrese su nombre" disabled="disabled">
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control form-control-lg" name="email" type="email" id="email" placeholder="Por favor ingrese su email" disabled readonly value="avalderramach@gmail.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="description">Descripcion</label>
        <textarea class="form-control form-control-sm" name="description" id="description" cols="30" rows="10" placeholder="Por favor escriba una breve descripcion"></textarea>
      </div>
    </form>
  </div>
  <!-- Bootstrap 5.3.3 JS Bundle (Incluye Popper.js) -->
  <script src="Plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
